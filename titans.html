<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Titans</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--haut de page-->
    <header>
      <a
        href="https://www.ea.com/fr/games/titanfall/titanfall-2"
        target="_blank"
        ><img src="images/logo_titanfall2.png" alt=""
      /></a>
      <div class="liens">
        <a href="index.html">Home</a>
        <a href="titans.html">Titans</a>
        <a href="arme.html">Wepons</a>
      </div>
      <a
        href="https://www.ea.com/fr/games/titanfall/titanfall-2"
        target="_blank"
      >
        <button>Play</button>
      </a>
    </header>

    <!-- corp de page -->
    <main>
      <section class="section">
        <div class="container">
          <div class="titan-kit">
            <div class="icon-slot">
              <img
                src="images/icons/autoeject.png"
                alt="Auto-éjection furtive"
              />
              <span class="hover-text">Auto-éjection furtive</span>
            </div>

            <div class="icon-slot">
              <img
                src="images/icons/processeur.png"
                alt="Processeur d'assaut"
              />
              <span class="hover-text">Processeur d'assaut</span>
            </div>

            <div class="icon-slot">
              <img src="images/icons/Turbomoteur.png" alt="Turbomoteur" />
              <span class="hover-text">Turbomoteur</span>
            </div>

            <div class="icon-slot">
              <img src="images/icons/charge_noyau.png" alt="Charge du noyau" />
              <span class="hover-text">Charge du noyau</span>
            </div>

            <div class="icon-slot">
              <img
                src="images/icons/éjection_nucleaire.png"
                alt="Éjection nucléaire"
              />
              <span class="hover-text">Éjection nucléaire</span>
            </div>

            <div class="icon-slot">
              <img src="images/icons/antirodeo.png" alt="Anti-rodéo" />
              <span class="hover-text">Anti-rodéo</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- bas de page -->
    <footer></footer>
  </body>
</html>
